# Lychee config for link-checking the built site.
#
# Usage:
#   bundle exec jekyll build
#   lychee --config lychee.toml _site/
#
# Excludes document false-positives and known TODOs. Keep this list short and
# justified - every entry is a link the build accepts as "broken on purpose."

# Treat _site/ as the document root so root-relative links resolve.
root_dir = "/Users/kylefiedler/Development/glp1-marketing/_site"

max_concurrency = 6
timeout = 20
accept = [200, 999]

exclude = [
  # ----- Bot-blocked but works in browsers (403 false positives) -----
  '^https://www\.traderjoes\.com',
  '^https://www\.mayoclinic\.org',

  # ----- Formspree form endpoints only accept POST -----
  '^https://formspree\.io/f/',

  # ----- Self-canonical on /404.html intentionally points at itself -----
  '^https://thatglp1girl\.com/404\.html$',

  # ----- Guides "Learn more" targets: live Showit detail pages not yet ported -----
  '^https?://[^/]+/glp-1-beginner-survival-kit',
  '^https?://[^/]+/glp-1-food-and-grocery-guide',
  '^https?://[^/]+/glp-1-girl-workout-starter-pack',
  '^https?://[^/]+/glp-1-travel-survival-kit',
  '^https?://[^/]+/wean-off-glp-2',
  '^https?://[^/]+/mini-supplement-guide',
  '^https?://[^/]+/7-day-meal-template',

  # ----- Mailtos -----
  '^mailto:',
]
