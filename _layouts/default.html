<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {%- if page.robots %}
  <meta name="robots" content="{{ page.robots }}">
  {%- endif %}
  {% feed_meta %}
  <link rel="icon" type="image/png" href="{{ '/assets/images/site/favicon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Lato:wght@400;700&family=Unbounded:wght@500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  {{ content }}
  <script src="{{ '/assets/js/forms.js' | relative_url }}" defer></script>
</body>
</html>
