{%- comment -%}
  Guides banner — "That GLP-1 Girl Guides" CTA with layered guide covers.
  Repeated at the bottom of home, about, coaching, journal, blog.
{%- endcomment -%}

<section class="banner banner--guides">
  <div class="banner__wave banner__wave--top" aria-hidden="true">
    <svg viewBox="0 0 1440 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 60 L1440 60 L1440 25 C 1200 60, 960 0, 720 30 C 480 60, 240 0, 0 30 Z" fill="#FEBBB4"/>
    </svg>
  </div>
  <div class="banner__inner">
    <div class="banner__media">
      <img src="{{ '/assets/images/home/beginner_kit_cover.png' | relative_url }}" alt="" loading="lazy" width="400" height="520" class="banner__cover banner__cover--back">
      <img src="{{ '/assets/images/home/workout_starter_cover.png' | relative_url }}" alt="" loading="lazy" width="400" height="520" class="banner__cover banner__cover--front">
    </div>
    <div class="banner__copy">
      <h2 class="banner__heading">That GLP-1 Girl Guides</h2>
      <p>Everything you need to tackle your GLP-1 journey.</p>
      <p><a class="btn btn--outline" href="{{ '/guides' | relative_url }}">See the guides</a></p>
    </div>
    <span class="decor decor--squiggle banner__decor banner__decor--squiggle" aria-hidden="true">
      {% include decor/squiggle.svg %}
    </span>
  </div>
  <div class="banner__wave banner__wave--bottom" aria-hidden="true">
    <svg viewBox="0 0 1440 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 0 L1440 0 L1440 35 C 1200 0, 960 60, 720 30 C 480 0, 240 60, 0 30 Z" fill="#FEBBB4"/>
    </svg>
  </div>
</section>
