{%- comment -%}
  Newsletter signup (EmailOctopus).

  The actual form HTML is injected by EmailOctopus's embed script at the
  position of the <script> tag below. Form-level styling (colors, button
  copy, fields) is configured in the EmailOctopus dashboard, not here.

  Form UUID lifted from the live site's home + footer newsletter slots.

  Params:
    heading (string, optional) - section heading. Default: "Join the newsletter".
    lead    (string, optional) - blurb above the form.
    note    (string, optional) - small print below the form.
{%- endcomment -%}

{%- assign nl_heading = include.heading | default: "Join the newsletter" -%}
{%- assign nl_form_id = "94634042-e774-11f0-8715-19e8bfe62148" -%}

<section class="newsletter">
  <div class="newsletter__inner">
    <h2 class="newsletter__heading">{{ nl_heading }}</h2>
    {%- if include.lead -%}
      <p class="newsletter__lead">{{ include.lead }}</p>
    {%- endif -%}

    <div class="newsletter__embed">
      <script async src="https://eocampaign1.com/form/{{ nl_form_id }}.js" data-form="{{ nl_form_id }}"></script>
    </div>

    {%- if include.note -%}
      <p class="newsletter__note">{{ include.note }}</p>
    {%- endif -%}
  </div>
</section>
