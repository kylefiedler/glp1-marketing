<footer class="site-footer">
  {% include wave.html fill="blush" still=true %}
  <div class="site-footer__inner">
    <div class="site-footer__side">
      <nav class="site-footer__links" aria-label="Site">
        <ul>
          <li><a href="{{ '/journal' | relative_url }}">Journal</a></li>
          <li><a href="{{ '/guides'  | relative_url }}">Guides</a></li>
          <li><a href="{{ '/coaching' | relative_url }}">Coaching</a></li>
        </ul>
        <ul class="site-footer__links--secondary">
          <li><a href="{{ '/'      | relative_url }}">Home</a></li>
          <li><a href="{{ '/about' | relative_url }}">About</a></li>
          <li><a href="{{ '/blog'  | relative_url }}">Blog</a></li>
        </ul>
      </nav>
      {% include social-links.html class="site-footer__social" %}
    </div>

    <div class="site-footer__contact">
      <h2 class="site-footer__heading">Contact Jess</h2>
      <form class="site-footer__form" method="POST" action="{{ site.formspree_endpoint }}" data-thanks="{{ '/thanks/' | relative_url }}">
        <input type="hidden" name="_subject" value="New contact message - That GLP-1 Girl">
        <label class="site-footer__field">
          <span class="visually-hidden">Name</span>
          <input type="text" name="name" placeholder="Name" required autocomplete="name">
        </label>
        <label class="site-footer__field">
          <span class="visually-hidden">Email</span>
          <input type="email" name="email" placeholder="Email" required autocomplete="email">
        </label>
        <label class="site-footer__field site-footer__field--wide">
          <span class="visually-hidden">Message</span>
          <textarea name="message" rows="4" placeholder="Message" required></textarea>
        </label>
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none">
        <button type="submit" class="btn btn--primary site-footer__submit">Submit</button>
      </form>
    </div>

    <a class="site-footer__brand" href="{{ '/' | relative_url }}" aria-label="That GLP-1 Girl — home">
      <img src="{{ '/assets/images/site/logo-dark.svg' | relative_url }}" alt="" width="70" height="63">
    </a>
  </div>

  <div class="site-footer__meta">
    <p class="site-footer__copy">&copy; {{ 'now' | date: '%Y' }} That GLP-1 Girl. All rights reserved.</p>
  </div>
</footer>
