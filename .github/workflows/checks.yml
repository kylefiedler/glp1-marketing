name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  spacing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check spacing stays on the 8-point scale
        run: scripts/check-spacing.sh

      - name: Check type stays on the roles
        run: scripts/check-type.sh
